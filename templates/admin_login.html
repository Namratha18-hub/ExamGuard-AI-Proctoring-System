<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | ExamGuard AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
                );

            font-family: Arial, sans-serif;
        }

        .login-card {

            width: 420px;
            max-width: 92%;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.35);
        }

        .admin-icon {

            text-align: center;

            font-size: 60px;

            margin-bottom: 10px;
        }

        .title {

            text-align: center;

            font-weight: 700;

            color: #243b55;
        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        .form-label {

            font-weight: 600;
        }

        .login-button {

            width: 100%;

            padding: 12px;

            font-weight: 700;

            border-radius: 10px;
        }

        .student-login {

            text-align: center;

            margin-top: 25px;
        }

        .student-login a {

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="admin-icon">
        🛡️
    </div>


    <h2 class="title">
        ExamGuard AI
    </h2>


    <p class="subtitle">
        Administrator Login
    </p>


    <!-- FLASH MESSAGE -->

    {% with messages =
        get_flashed_messages(
            with_categories=true
        )
    %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="alert alert-danger">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- ADMIN LOGIN FORM -->

    <form
        method="POST"
        action="{{ url_for('admin_login') }}"
    >


        <!-- USERNAME -->

        <div class="mb-3">

            <label class="form-label">

                Admin Username

            </label>


            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter admin username"
                required
                autocomplete="username"
            >

        </div>


        <!-- PASSWORD -->

        <div class="mb-4">

            <label class="form-label">

                Admin Password

            </label>


            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
            >

        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            class="btn btn-dark login-button"
        >

            🔐 Admin Login

        </button>


    </form>


    <!-- STUDENT LOGIN -->

    <div class="student-login">

        <a href="{{ url_for('login') }}">

            ← Go to Student Login

        </a>

    </div>


</div>


</body>

</html>
